<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2e7de9">
  <title>ケーキでピッタリ！</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── パレット: 空色×白×コーラルの3色ベース ── */
      --sky:      #2e7de9;
      --sky-dark: #1a5bbf;
      --sky-pale: #e8f1fd;
      --coral:    #f26b5b;
      --coral-dark: #c94f3e;
      --sand:     #f5a623;
      --sand-dark: #c07d10;
      --mint:     #4ecdc4;
      --mint-dark: #2ba39a;
      --white:    #ffffff;
      --off-white:#f9f9f9;
      --text:     #1e2a3a;
      --muted:    #6b7a8d;
      --line:     #dde4ef;

      --card-front: #c8ddf7;
      --card-front-h: #a8c8f4;

      --card-size: 88px;
      --gap: 9px;
      --radius: 16px;
      --shadow: 0 3px 12px rgba(30,42,58,0.10);
    }

    html { height: 100%; }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', 'Rounded Mplus 1c', sans-serif;
      background: var(--sky-pale);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 28px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    /* ── アプリ幅 ── */
    .app {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* ── ヘッダー ── */
    .header { text-align: center; }
    .header h1 {
      font-size: clamp(18px, 4.5vw, 30px);
      font-weight: 900;
      color: var(--sky);
      letter-spacing: 0.03em;
      text-shadow: 0 2px 0 rgba(255,255,255,0.8);
    }
    .header p {
      font-size: clamp(11px, 2.4vw, 13px);
      color: var(--muted);
      margin-top: 1px;
    }
    @media (max-width: 360px) {
      .header p { display: none; }
    }

    /* ── ルールパネル ── */
    .rules {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 2px solid var(--line);
    }
    .rules summary {
      font-size: clamp(12px, 2.8vw, 15px);
      font-weight: bold;
      color: var(--sky);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
    }
    .rules summary::-webkit-details-marker { display: none; }
    .rules summary::after {
      content: '▼';
      font-size: 10px;
      margin-left: auto;
      color: var(--muted);
      transition: transform 0.25s;
    }
    .rules[open] summary::after { transform: rotate(180deg); }
    .rules-body {
      padding: 0 14px 10px;
      border-top: 1px solid var(--line);
    }
    .rules ul {
      padding: 8px 0 0 18px;
      font-size: clamp(11px, 2.6vw, 14px);
      line-height: 1.75;
      color: var(--text);
    }
    rt { font-size: 9px; color: var(--sky); font-weight: bold; }

    /* ── コントロールパネル ── */
    .controls {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 2px solid var(--line);
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      justify-content: center;
    }

    /* ── ボタン共通 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px 18px;
      font-size: clamp(12px, 2.8vw, 16px);
      font-weight: bold;
      font-family: inherit;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.08s, box-shadow 0.08s, filter 0.1s, opacity 0.15s;
    }
    .btn:active    { transform: translateY(3px); box-shadow: none !important; }
    .btn:hover:not(:active) { filter: brightness(1.07); }

    .btn-practice {
      background: var(--sky-pale);
      color: var(--sky-dark);
      border: 2px solid var(--sky);
      box-shadow: 0 3px 0 var(--sky-dark);
    }
    .btn-level {
      background: var(--off-white);
      color: var(--muted);
      border: 2px solid var(--line);
      box-shadow: 0 3px 0 var(--line);
      min-width: 66px;
    }
    .btn-level.active {
      background: var(--sand);
      color: var(--white);
      border-color: var(--sand-dark);
      box-shadow: 0 3px 0 var(--sand-dark);
    }
    .btn-start {
      background: var(--coral);
      color: var(--white);
      box-shadow: 0 4px 0 var(--coral-dark);
      min-width: 100px;
    }
    .btn-reset {
      background: var(--mint);
      color: var(--white);
      box-shadow: 0 3px 0 var(--mint-dark);
    }

    /* ── 操作ロック中はれんしゅう/レベル変更を無効化 ── */
    body.locked #game .card { pointer-events: none; }
    body.locked .controls .btn-practice,
    body.locked .controls .btn-level {
      pointer-events: none;
      opacity: 0.5;
    }

    /* ── タイマー（右上の固定バッジ） ── */
    .timer-wrap {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--white);
      border-radius: 50px;
      padding: 4px 12px;
      box-shadow: var(--shadow);
      border: 2px solid var(--line);
      z-index: 50;
    }
    .timer-label {
      font-size: 9px;
      font-weight: bold;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    #timer {
      font-size: clamp(14px, 3.6vw, 19px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: var(--text);
      letter-spacing: 0.06em;
    }
    .hide-timer .timer-wrap { visibility: hidden; }

    /* ── メッセージ（画面中央） ── */
    #msg {
      width: 100%;
      font-size: clamp(15px, 4vw, 22px);
      font-weight: bold;
      color: var(--coral);
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── ゲームグリッド ── */
    #game {
      display: grid;
      gap: var(--gap);
      justify-content: center;
      grid-template-columns: repeat(var(--cols, 4), var(--card-size));
      width: 100%;
      padding: 2px 0;
    }

    /* ── カード ── */
    .card {
      width: var(--card-size);
      height: var(--card-size);
      perspective: 700px;
      cursor: pointer;
    }
    .inner {
      width: 100%; height: 100%;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flipped { transform: rotateY(180deg); }

    .front, .back {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 8px rgba(30,42,58,0.13);
    }
    .front {
      background: linear-gradient(145deg, var(--card-front), var(--card-front-h));
      border: 2px solid rgba(46,125,233,0.25);
    }
    .front::before {
      content: '';
      width: 38%;
      height: 38%;
      border: 3px solid rgba(46,125,233,0.35);
      transform: rotate(45deg);
      border-radius: 4px;
    }
    .back {
      background: var(--white);
      transform: rotateY(180deg);
      border: 2.5px solid var(--sky);
    }

    /* ── パルス（チュートリアルヒント）── */
    .highlight-pulse {
      animation: pulse 1.4s infinite;
      z-index: 10;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(46,125,233,0.65); }
      70%  { box-shadow: 0 0 0 16px rgba(46,125,233,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,125,233,0); }
    }

    /* ── シェイク ── */
    .shake { animation: shake 0.42s both; }
    @keyframes shake {
      10%,90% { transform: translate3d(-1px,0,0); }
      20%,80% { transform: translate3d(2px,0,0); }
      30%,50%,70% { transform: translate3d(-4px,0,0); }
      40%,60%  { transform: translate3d(4px,0,0); }
    }

    /* ── アニメ用ステージ ── */
    #stage {
      position: fixed; top:0; left:0; width:100%; height:100%;
      pointer-events: none; z-index: 100;
    }
    .piece {
      width: 68px; height: 68px;
      position: absolute;
      transition: 0.7s cubic-bezier(0.4,0,0.2,1);
    }
    .plate {
      position: absolute;
      top:50%; left:50%;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--line);
      box-shadow: var(--shadow);
    }
    .circle {
      width: 100%; height: 100%;
      border-radius: 50%;
      transition: transform 0.55s cubic-bezier(0.34,1.56,0.64,1);
    }
    .label {
      position: absolute;
      width: 100%; top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-weight: bold;
      font-size: clamp(13px, 3vw, 19px);
      color: var(--text);
      text-shadow: 1px 1px 0 white,-1px -1px 0 white,1px -1px 0 white,-1px 1px 0 white;
      pointer-events: none;
    }

    /* ── できたケーキ（横スクロール1段） ── */
    .results-section {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .results-title {
      font-size: clamp(11px, 2.6vw, 14px);
      font-weight: bold;
      color: var(--sky);
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #result {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 4px;
      flex: 1;
      min-height: 56px;
    }
    .result-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--white);
      padding: 6px 10px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 2px solid var(--line);
      animation: popIn 0.38s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
    }
    .formula {
      font-size: clamp(10px, 2.4vw, 13px);
      font-weight: bold;
      color: var(--sky);
      margin-top: 4px;
    }

    /* ── チュートリアルオーバーレイ ── */
    #tutorial-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: clamp(30px, 6vh, 60px);
      z-index: 1000;
      pointer-events: none;
      background: transparent;
    }
    .tutorial-box {
      pointer-events: auto;
      background: var(--white);
      padding: clamp(12px, 3vw, 22px) clamp(16px, 4vw, 30px);
      border-radius: 22px;
      max-width: min(86vw, 440px);
      box-shadow: 0 10px 36px rgba(30,42,58,0.16);
      text-align: center;
      border: 3px solid var(--sky);
      animation: popIn 0.38s cubic-bezier(0.34,1.56,0.64,1);
    }
    .tutorial-box h4 {
      font-size: clamp(13px, 3.2vw, 18px);
      color: var(--sky);
      margin-bottom: 6px;
      font-weight: 900;
    }
    .tutorial-box p {
      font-size: clamp(12px, 3vw, 16px);
      font-weight: bold;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .tutorial-btn-container {
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    .tutorial-btn-skip {
      background: var(--off-white) !important;
      color: var(--muted) !important;
      border: 2px solid var(--line) !important;
      box-shadow: 0 3px 0 var(--line) !important;
      font-size: clamp(11px, 2.6vw, 13px) !important;
    }

    /* ── 数式オーバーレイ（完成時に表示・自動で消える） ── */
    #formula-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #formula-overlay.show { opacity: 1; }
    .formula-card {
      background: var(--white);
      padding: clamp(22px, 6vw, 44px) clamp(28px, 8vw, 56px);
      border-radius: 26px;
      box-shadow: 0 16px 48px rgba(30,42,58,0.18);
      text-align: center;
      border: 3px solid var(--sky);
      max-width: 90vw;
      transform: scale(0.88);
      transition: transform 0.25s;
    }
    #formula-overlay.show .formula-card { transform: scale(1); }
    .formula-label {
      font-size: clamp(14px, 4vw, 22px);
      font-weight: bold;
      color: var(--coral);
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }
    .formula-text {
      font-size: clamp(28px, 9vw, 52px);
      font-weight: 900;
      color: var(--text);
      white-space: nowrap;
    }

    /* ── フッター ── */
    .footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: clamp(10px, 2.4vw, 12px);
      color: var(--muted);
      padding: 4px 0 0;
    }
    .footer-copy { white-space: nowrap; }
    .footer-sep { color: var(--line); }
    .footer-link {
      background: none;
      border: none;
      font: inherit;
      color: var(--sky);
      font-weight: bold;
      cursor: pointer;
      padding: 4px 2px;
      text-decoration: underline;
      text-decoration-color: transparent;
      transition: text-decoration-color 0.15s, color 0.15s;
    }
    .footer-link:hover,
    .footer-link:active {
      color: var(--sky-dark);
      text-decoration-color: var(--sky);
    }

    /* ── 情報モーダル（利用規約・お問い合わせ） ── */
    .info-modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(30,42,58,0.45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      padding: 16px;
    }
    .info-modal {
      position: relative;
      background: var(--white);
      border-radius: 22px;
      border: 3px solid var(--sky);
      box-shadow: 0 16px 48px rgba(30,42,58,0.25);
      max-width: min(92vw, 480px);
      max-height: 85vh;
      overflow-y: auto;
      padding: clamp(22px, 5vw, 32px);
      text-align: left;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .info-modal h3 {
      font-size: clamp(16px, 4vw, 22px);
      color: var(--sky);
      font-weight: 900;
      text-align: center;
      margin-bottom: 14px;
    }
    .info-modal h4 {
      font-size: clamp(13px, 3.4vw, 16px);
      color: var(--sky-dark);
      font-weight: 900;
      margin: 16px 0 6px;
    }
    .info-modal h4:first-of-type { margin-top: 2px; }
    .info-link {
      background: none;
      border: none;
      font: inherit;
      color: var(--sky);
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      padding: 0 1px;
    }
    .info-link:active { color: var(--sky-dark); }
    .info-modal p {
      font-size: clamp(13px, 3.2vw, 16px);
      line-height: 1.85;
      color: var(--text);
      margin-bottom: 10px;
    }
    .info-modal p:last-child { margin-bottom: 0; }
    .info-modal strong { color: var(--coral-dark); }
    .info-email {
      display: inline-block;
      font-weight: bold;
      color: var(--sky-dark);
      background: var(--sky-pale);
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 6px 14px;
      margin: 2px 0 10px;
      word-break: break-all;
      font-size: clamp(13px, 3.4vw, 17px);
    }
    .info-modal-close {
      position: absolute;
      top: 10px; right: 10px;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--off-white);
      color: var(--muted);
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: transform 0.08s;
    }
    .info-modal-close:active { transform: translateY(1px); }

    /* ── クリアおめでとうオーバーレイ ── */
    .clear-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .clear-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .confetti-layer {
      position: absolute; inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti-piece {
      position: absolute;
      top: -8%;
      animation: confetti-fall linear infinite;
    }
    @keyframes confetti-fall {
      0%   { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(112vh) rotate(360deg); }
    }
    .clear-card {
      position: relative;
      background: var(--white);
      padding: clamp(28px, 7vw, 48px) clamp(28px, 9vw, 56px);
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(30,42,58,0.2);
      text-align: center;
      border: 4px solid var(--coral);
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 90vw;
    }
    .clear-title {
      font-size: clamp(32px, 10vw, 56px);
      font-weight: 900;
      color: var(--coral);
      letter-spacing: 0.06em;
    }
    .clear-sub {
      font-size: clamp(13px, 3.4vw, 17px);
      font-weight: bold;
      color: var(--sky-dark);
      margin: 8px 0 16px;
    }
    .clear-time-label {
      font-size: 11px;
      font-weight: bold;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .clear-time {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: var(--text);
      background: var(--sky-pale);
      border-radius: 14px;
      padding: 8px 22px;
      display: inline-block;
      margin-bottom: 20px;
    }

    /* ── アニメーション ── */
    @keyframes popIn {
      0%   { transform: scale(0.82); opacity: 0; }
      100% { transform: scale(1);    opacity: 1; }
    }

    /* ── レスポンシブ ── */
    @media (min-width: 480px) {
      :root { --card-size: 96px; --gap: 11px; }
    }
    @media (min-width: 640px) {
      :root { --card-size: 104px; --gap: 12px; }
      body  { padding: 16px 20px 36px; }
      .app  { gap: 12px; }
    }
    @media (max-width: 360px) {
      :root { --card-size: 74px; --gap: 7px; }
    }
    @supports (padding: env(safe-area-inset-bottom)) {
      body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .inner { transition: none; }
      .highlight-pulse, .shake, .result-item { animation: none; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ヘッダー -->
  <header class="header">
    <h1>ケーキでピッタリ！</h1>
    <p><ruby>分数<rt>ぶんすう</rt></ruby>のペアをさがすゲーム</p>
  </header>

  <!-- ルール（折りたたみ） -->
  <details class="rules" open>
    <summary>ルールと<ruby>使<rt>つか</rt></ruby>い<ruby>方<rt>かた</rt></ruby></summary>
    <div class="rules-body">
      <ul>
        <li>カードを２<ruby>枚<rt>まい</rt></ruby>めくって、<ruby>足<rt>た</rt></ruby>して「１」になる<ruby>分数<rt>ぶんすう</rt></ruby>のペアをさがそう！</li>
        <li>ピッタリ「１」になると、ケーキが<ruby>完成<rt>かんせい</rt></ruby>するよ</li>

<script>
  /* ===== 定数 ===== */
  const GameMode = { NORMAL:'NORMAL', TUTORIAL:'TUTORIAL' };
  const TutorialPhase = { DEMO:'DEMO', GUIDE:'GUIDE', FREE:'FREE' };
  const GameState = {
    READY:'READY', IDLE:'IDLE', CHECKING:'CHECKING',
    ANIMATING:'ANIMATING', RESETTING:'RESETTING'
  };
  const AT = {
    SET_LEVEL:'SET_LEVEL', START_GAME:'START_GAME', PLAY_AGAIN:'PLAY_AGAIN',
    START_TUTORIAL:'START_TUTORIAL', SET_TUTORIAL_PHASE:'SET_TUTORIAL_PHASE',
    SKIP_TUTORIAL:'SKIP_TUTORIAL', FLIP_CARD:'FLIP_CARD',
    EVALUATE_MATCH:'EVALUATE_MATCH', MATCH_SUCCESS:'MATCH_SUCCESS',
    MATCH_FAIL:'MATCH_FAIL', TICK_TIMER:'TICK_TIMER', SHOW_FORMULA:'SHOW_FORMULA'
  };

  /* タイミング定数 (ms) */
  const TIMING = {
    FLIP_CHECK_DELAY: 600,    /* 2枚目をめくってから判定までの待ち */
    MISMATCH_RESET: 1200,     /* 不一致時に元に戻すまでの待ち */
    MATCH_ANIM_TOTAL: 2400,   /* ケーキ完成アニメ全体の長さ */
    FORMULA_TOAST: 1900       /* 数式オーバーレイの表示時間 */
  };

  const TUTORIAL_CONFIG = {
    [TutorialPhase.DEMO]: {
      title: "Step A: やってみよう！",
      getMsg: s => s===1
        ? "まずは<ruby>青<rt>あお</rt></ruby>く<ruby>光<rt>ひか</rt></ruby>っているカードをえらんでみてね！"
        : "もう1<ruby>枚<rt>まい</rt></ruby>！ピッタリになるかな？",
      successMsg: "すごい！これがケーキ<ruby>作<rt>づく</rt></ruby>りの<ruby>基本<rt>きほん</rt></ruby>だよ。",
      nextPhase: TutorialPhase.GUIDE, nextBtnText: "つぎへ！"
    },
    [TutorialPhase.GUIDE]: {
      title: "Step B: ガイドつき<ruby>練習<rt>れんしゅう</rt></ruby>",
      getMsg: s => s===1
        ? "<ruby>自分<rt>じぶん</rt></ruby>でえらんでみよう。<ruby>青<rt>あお</rt></ruby>い<ruby>光<rt>ひかり</rt></ruby>がヒントだよ！"
        : "ケーキがピッタリになるカードをさがしてね！",
      successMsg: "バッチリ！だいぶなれてきたね。",
      nextPhase: TutorialPhase.FREE, nextBtnText: "<ruby>自由<rt>じゆう</rt></ruby>に<ruby>練習<rt>れんしゅう</rt></ruby>！"
    },
    [TutorialPhase.FREE]: {
      title: "Step C: <ruby>自由<rt>じゆう</rt></ruby>に<ruby>練習<rt>れんしゅう</rt></ruby>",
      getMsg: () => "どれくらい<ruby>足<rt>た</rt></ruby>りないか<ruby>考<rt>かんが</rt></ruby>えて、どんどん<ruby>作<rt>つく</rt></ruby>ってみよう！",
      successMsg: "これでケーキ<ruby>作<rt>づく</rt></ruby>りの<ruby>名人<rt>めいじん</rt></ruby>だね！",
      nextPhase: null, nextBtnText: "<ruby>本番<rt>ほんばん</rt></ruby>スタート！"
    }
  };

  const pairsData = [
    [{v:1/2,l:"1/2"},{v:1/2,l:"1/2"}],
    [{v:1/3,l:"1/3"},{v:2/3,l:"2/3"}],
    [{v:1/4,l:"1/4"},{v:3/4,l:"3/4"}],
    [{v:1/5,l:"1/5"},{v:4/5,l:"4/5"}],
    [{v:1/6,l:"1/6"},{v:5/6,l:"5/6"}],
    [{v:2/5,l:"2/5"},{v:3/5,l:"3/5"}],
    [{v:1/8,l:"1/8"},{v:7/8,l:"7/8"}],
    [{v:3/8,l:"3/8"},{v:5/8,l:"5/8"}]
  ];

  /* ケーキのパーツカラー: 落ち着いた8色 */
  const pieceColors = [
    "#f28b82","#a8d5a2","#81c0e8","#f6c76b",
    "#c9a0e8","#f4a36a","#82cfc9","#e8a4b8"
  ];

  /* ===== 利用規約・お問い合わせ ===== */
  const INFO_CONTENT = {
    terms: {
      title: "利用規約",
      body: `
        <h4>1. サービスについて</h4>
        <p>「ケーキでピッタリ！」（以下「本サービス」）は、足して1になる分数のペアをさがす、分数の学習を目的としたゲームです。本サービスは非営利・学習目的で提供しています。</p>

        <h4>2. 免責事項</h4>
        <p>本サービスの利用によって生じたいかなる損害についても、作者は責任を負いません。サービスの内容は予告なく変更・終了する場合があります。</p>

        <h4>3. ソースコードのライセンス</h4>
        <p>本サービスのソースコードは、非営利目的・改変なしに限り使用・共有を許可します。商用利用・改変・改変物の配布は禁止します。使用の際はご連絡いただけると幸いです。</p>

        <h4>4. お問い合わせ</h4>
        <p>ご意見・ご要望は<button class="info-link" onclick="openInfoModal('contact')">お問い合わせ</button>よりご連絡ください。</p>
      `
    },
    contact: {
      title: "お問い合わせ",
      body: `
        <p>バグの報告・ご意見・ご要望などは、お気軽に下記のメールアドレスまでご連絡ください。</p>
        <div class="info-email">Srecon04@gmail.com</div>
        <p>学校などでご利用いただく場合や、ソースコードをご使用・共有される場合は、ひと言ご連絡いただけると幸いです。</p>
      `
    }
  };

  function openInfoModal(type) {
    const cfg = INFO_CONTENT[type];
    if(!cfg) return;
    document.getElementById('info-modal-title').innerHTML = cfg.title;
    document.getElementById('info-modal-body').innerHTML = cfg.body;
    document.getElementById('info-modal-overlay').style.display = 'flex';
  }
  function closeInfoModal() {
    document.getElementById('info-modal-overlay').style.display = 'none';
  }

  /* ===== ユーティリティ ===== */
  function shuffle(arr) {
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function formatTime(s) {
    if(typeof s!=='number') return "00:00";
    return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
  }

  /* カード枚数・画面サイズから最適な列数を計算（行数が最小になる列数を優先） */
  function bestCols(count) {
    const root = document.documentElement;
    const cardSize = parseFloat(getComputedStyle(root).getPropertyValue('--card-size')) || 88;
    const gap = parseFloat(getComputedStyle(root).getPropertyValue('--gap')) || 9;
    const maxWidth = Math.min(window.innerWidth - 20, 640);
    const candidates = [2,3,4,5,6,7,8];
    let minRows = Infinity;
    let fitCols = [];
    for (const cols of candidates) {
      const needed = cols * cardSize + (cols - 1) * gap;
      if (needed > maxWidth) continue;
      const rows = Math.ceil(count / cols);
      if (rows < minRows) { minRows = rows; fitCols = [cols]; }
      else if (rows === minRows) { fitCols.push(cols); }
    }
    if (!fitCols.length) {
      const fallback = Math.max(2, Math.floor(maxWidth / (cardSize + gap)));
      return Math.min(count, fallback) || 2;
    }
    return Math.min(...fitCols);
  }

  function createDeck(level, isPractice=false) {
    const pairs = isPractice
      ? shuffle(pairsData).slice(0,2)
      : shuffle(pairsData).slice(0,level);
    const flat = pairs.flat();
    /* カード枚数分の色をシャッフルして1枚ずつ割り当て（ペアで色が重ならない） */
    const colorPool = shuffle([...pieceColors, ...pieceColors]).slice(0, flat.length);
    const deck = flat.map((item,i)=>({
      id:`pair-${Math.floor(i/2)}-item-${i%2}`,
      v:item.v, l:item.l,
      color:colorPool[i],
      isCleared:false, isFlipped:false
    }));
    return isPractice ? deck : shuffle(deck);
  }

  /* ===== ステート ===== */
  let state = {
    level:3, mode:GameMode.NORMAL, tutorialPhase:null, tutorialStep:0,
    status:GameState.READY, cards:[],
    flipped:{first:null,second:null},
    elapsedSeconds:0, isGameCleared:false,
    lastMatchedPair:null, showFormula:null, shakeCardId:null
  };

  /* ===== Reducer ===== */
  function reducer(s, action) {
    switch(action.type) {
      case AT.SET_LEVEL:
        return {...s, level:action.payload, mode:GameMode.NORMAL, tutorialPhase:null, tutorialStep:0,
          status:GameState.READY, cards:createDeck(action.payload),
          flipped:{first:null,second:null}, elapsedSeconds:0,
          isGameCleared:false, lastMatchedPair:null, showFormula:null, shakeCardId:null};

      case AT.PLAY_AGAIN:
        /* クリアおめでとう画面から、同じペア数で新しいカードを準備（スタートは再度押す） */
        return {...s, mode:GameMode.NORMAL, tutorialPhase:null, tutorialStep:0,
          status:GameState.READY, cards:createDeck(s.level),
          flipped:{first:null,second:null}, elapsedSeconds:0,
          isGameCleared:false, lastMatchedPair:null, showFormula:null, shakeCardId:null};

      case AT.START_TUTORIAL:
        return {...s, mode:GameMode.TUTORIAL, tutorialPhase:TutorialPhase.DEMO, tutorialStep:1,
          status:GameState.IDLE, cards:createDeck(2,true),
          flipped:{first:null,second:null}, elapsedSeconds:0,
          isGameCleared:false, lastMatchedPair:null, showFormula:null, shakeCardId:null};

      case AT.SET_TUTORIAL_PHASE:
        return {...s, tutorialPhase:action.payload, tutorialStep:1, status:GameState.IDLE,
          cards:createDeck(2,true), flipped:{first:null,second:null},
          isGameCleared:false, lastMatchedPair:null, showFormula:null, shakeCardId:null};

      case AT.SKIP_TUTORIAL:
        return {...s, mode:GameMode.NORMAL, tutorialPhase:null, tutorialStep:0,
          status:GameState.READY, cards:createDeck(s.level),
          flipped:{first:null,second:null}, elapsedSeconds:0,
          isGameCleared:false, lastMatchedPair:null, showFormula:null, shakeCardId:null};

      case AT.START_GAME:
        if(s.status!==GameState.READY) return s;
        return {...s, status:GameState.IDLE, elapsedSeconds:0};

      case AT.TICK_TIMER:
        if(s.status===GameState.READY||s.isGameCleared||s.mode===GameMode.TUTORIAL) return s;
        return {...s, elapsedSeconds:s.elapsedSeconds+1};

      case AT.FLIP_CARD: {
        /* 判定中・演出中・数式トースト表示中はカード操作を一切受け付けない（連打対策） */
        if(s.status!==GameState.IDLE || s.showFormula) return s;
        const card = s.cards.find(c=>c.id===action.payload);
        if(!card||card.isCleared||card.isFlipped) return s;

        if(s.mode===GameMode.TUTORIAL) {
          const uncleared = s.cards.filter(c=>!c.isCleared);
          if(s.tutorialPhase===TutorialPhase.DEMO) {
            if(s.tutorialStep===1 && action.payload!==uncleared[0].id) return s;
            if(s.tutorialStep===2 && action.payload!==uncleared[1].id) return s;
          } else if(s.tutorialPhase===TutorialPhase.GUIDE && s.flipped.first) {
            const fc = s.cards.find(c=>c.id===s.flipped.first);
            if(!fc||Math.abs(fc.v+card.v-1)>=0.01) return {...s, shakeCardId:action.payload};
          }
        }

        const newCards = s.cards.map(c=>c.id===action.payload?{...c,isFlipped:true}:c);
        let nextStep = s.tutorialStep;
        if(s.mode===GameMode.TUTORIAL) {
          if(s.tutorialStep===1) nextStep=2;
          else if(s.tutorialStep===2) nextStep=3;
        }
        if(!s.flipped.first)
          return {...s, cards:newCards, flipped:{first:action.payload,second:null}, tutorialStep:nextStep, shakeCardId:null};
        else
          return {...s, status:GameState.CHECKING, cards:newCards, flipped:{...s.flipped,second:action.payload}, tutorialStep:nextStep, shakeCardId:null};
      }

      case AT.EVALUATE_MATCH: {
        if(s.status!==GameState.CHECKING) return s;
        const c1=s.cards.find(c=>c.id===s.flipped.first);
        const c2=s.cards.find(c=>c.id===s.flipped.second);
        const match = Math.abs(c1.v+c2.v-1)<0.01;
        return {...s, status:match?GameState.ANIMATING:GameState.RESETTING,
          lastMatchedPair:match?{a:c1,b:c2}:null};
      }

      case AT.MATCH_SUCCESS: {
        const {first,second}=s.flipped;
        const newCards=s.cards.map(c=>(c.id===first||c.id===second)?{...c,isCleared:true}:c);
        const isCleared=newCards.every(c=>c.isCleared);
        const {a,b}=s.lastMatchedPair;
        return {...s, status:GameState.IDLE, cards:newCards, flipped:{first:null,second:null},
          isGameCleared:isCleared, showFormula:{a,b,text:`${a.l} + ${b.l} = 1`},
          tutorialStep:s.mode===GameMode.TUTORIAL?1:s.tutorialStep};
      }

      case AT.MATCH_FAIL: {
        const {first,second}=s.flipped;
        const newCards=s.cards.map(c=>(c.id===first||c.id===second)?{...c,isFlipped:false}:c);
        const nextStep=(s.mode===GameMode.TUTORIAL&&s.tutorialPhase!==TutorialPhase.FREE)
          ? 1 : s.tutorialStep;
        return {...s, status:GameState.IDLE, cards:newCards, flipped:{first:null,second:null}, tutorialStep:nextStep};
      }

      case AT.SHOW_FORMULA:
        return {...s, showFormula:action.payload};

      default: return s;
    }
  }

  /* ===== タイマー／演出の管理 ===== */
  const timers = { timeouts:[], interval:null };

  function clearAllTimeouts() {
    timers.timeouts.forEach(clearTimeout);
    timers.timeouts=[];
  }
  function clearTickInterval() {
    if(timers.interval) { clearInterval(timers.interval); timers.interval=null; }
  }
  /* ステージ上に残ったケーキパーツ・お皿を全て取り除く（ID衝突によるバグ防止） */
  function clearStage() {
    document.querySelectorAll('#stage .piece, #stage .plate').forEach(el=>el.remove());
  }
  /* モード切り替え・リセット時に演出関連を完全初期化 */
  function resetEffectsState() {
    clearAllTimeouts();
    clearTickInterval();
    clearStage();
  }

  /* ===== dispatch ===== */
  function dispatch(action) {
    const next = reducer(state, action);
    if(next!==state) {
      state=next;
      render(state);
      effects(state, action);
    }
  }

  function effects(s, action) {
    if(action.type===AT.SKIP_TUTORIAL ||
       (action.type===AT.MATCH_SUCCESS && s.isGameCleared && s.tutorialPhase===TutorialPhase.FREE)) {
      localStorage.setItem('hasPlayedTutorial','true');
    }

    /* モード切り替え／リセット時は演出を完全初期化（連打・誤操作対策） */
    if([AT.SET_LEVEL, AT.PLAY_AGAIN, AT.START_TUTORIAL, AT.SET_TUTORIAL_PHASE, AT.SKIP_TUTORIAL].includes(action.type)) {
      resetEffectsState();
    }

    /* スタート／れんしゅう開始時はルール説明を自動でしまう（モバイルの省スペース化） */
    if(action.type===AT.START_GAME || action.type===AT.START_TUTORIAL) {
      const rules=document.querySelector('.rules');
      if(rules) rules.open=false;
    }

    if(action.type===AT.START_GAME && s.mode===GameMode.NORMAL) {
      clearTickInterval();
      timers.interval=setInterval(()=>dispatch({type:AT.TICK_TIMER}),1000);
    }
    if(action.type===AT.MATCH_SUCCESS && s.isGameCleared) {
      clearTickInterval();
    }
    if(action.type===AT.FLIP_CARD && s.status===GameState.CHECKING) {
      const t=setTimeout(()=>dispatch({type:AT.EVALUATE_MATCH}),TIMING.FLIP_CHECK_DELAY);
      timers.timeouts.push(t);
    }
    if(action.type===AT.EVALUATE_MATCH) {
      if(s.status===GameState.ANIMATING) {
        triggerMatchAnim(s.lastMatchedPair.a, s.lastMatchedPair.b,
          ()=>dispatch({type:AT.MATCH_SUCCESS}));
      } else if(s.status===GameState.RESETTING) {
        const t=setTimeout(()=>dispatch({type:AT.MATCH_FAIL}),TIMING.MISMATCH_RESET);
        timers.timeouts.push(t);
      }
    }
    /* 数式トーストを一定時間後に自動で閉じる（画面ロック解除） */
    if(action.type===AT.MATCH_SUCCESS && s.showFormula) {
      const t=setTimeout(()=>dispatch({type:AT.SHOW_FORMULA, payload:null}), TIMING.FORMULA_TOAST);
      timers.timeouts.push(t);
    }
  }

  /* ===== レンダリング ===== */
  function render(s) {
    document.body.classList.toggle("hide-timer", s.mode===GameMode.TUTORIAL);

    /* 画面ロック中かどうか（判定中・演出中・数式トースト表示中） */
    const isLocked = (s.status!==GameState.READY && s.status!==GameState.IDLE) || !!s.showFormula;
    document.body.classList.toggle("locked", isLocked);

    /* タイマー */
    const timerEl=document.getElementById("timer");
    if(timerEl) timerEl.textContent=formatTime(s.elapsedSeconds);

    /* メッセージ */
    const msgEl=document.getElementById("msg");
    if(msgEl) {
      if(s.status===GameState.READY)
        msgEl.innerHTML="スタートをおしてね！";
      else if(s.status===GameState.ANIMATING)
        msgEl.innerHTML="ぴったり！";
      else if(s.status===GameState.RESETTING)
        msgEl.innerHTML="おしい！";
      else if(s.isGameCleared && s.mode===GameMode.NORMAL)
        msgEl.innerHTML=`クリア！ <ruby>記録<rt>きろく</rt></ruby>: ${formatTime(s.elapsedSeconds)}`;
      else
        msgEl.innerHTML="";
    }

    /* レベルボタン */
    [3,5,8].forEach(n=>{
      const b=document.getElementById(`btn-${n}`);
      if(b) b.classList.toggle('active', s.level===n && s.mode===GameMode.NORMAL);
    });

    renderTutorial(s);
    renderCards(s);
    renderPieces(s);
    renderResults(s);
    renderFormulaOverlay(s);
    renderClearOverlay(s);
  }

  function renderFormulaOverlay(s) {
    const overlay=document.getElementById("formula-overlay");
    const display=document.getElementById("formula-display");
    if(!overlay||!display) return;
    if(s.showFormula) {
      display.textContent=s.showFormula.text;
      overlay.classList.add("show");
    } else {
      overlay.classList.remove("show");
    }
  }

  /* クリアおめでとう画面（通常モードのみ。チュートリアル中は専用の案内を使う） */
  function renderClearOverlay(s) {
    const overlay=document.getElementById("clear-overlay");
    if(!overlay) return;
    const shouldShow = s.isGameCleared && s.mode===GameMode.NORMAL && !s.showFormula;
    if(shouldShow) {
      if(!overlay.classList.contains("show")) {
        const timeEl=document.getElementById("clear-time");
        if(timeEl) timeEl.textContent=formatTime(s.elapsedSeconds);
        buildConfetti();
        overlay.classList.add("show");
      }
    } else {
      overlay.classList.remove("show");
    }
  }

  /* お祝いの紙ふぶきを生成（パレット内の4色のみ使用） */
  const CONFETTI_COLORS = ['var(--sky)','var(--coral)','var(--sand)','var(--mint)'];
  function buildConfetti() {
    const layer=document.getElementById("confetti-layer");
    if(!layer) return;
    layer.innerHTML="";
    const count=26;
    for(let i=0;i<count;i++) {
      const piece=document.createElement("div");
      piece.className="confetti-piece";
      const size=6+Math.random()*7;
      piece.style.left=(Math.random()*100)+"%";
      piece.style.width=size+"px";
      piece.style.height=size+"px";
      piece.style.background=CONFETTI_COLORS[i%CONFETTI_COLORS.length];
      piece.style.borderRadius=Math.random()<0.5?"50%":"3px";
      piece.style.animationDuration=(2.2+Math.random()*1.8)+"s";
      piece.style.animationDelay=(Math.random()*1.4)+"s";
      layer.appendChild(piece);
    }
  }

  function renderTutorial(s) {
    const overlay=document.getElementById("tutorial-overlay");
    if(!overlay) return;
    if(s.mode!==GameMode.TUTORIAL){ overlay.style.display="none"; return; }
    const cfg=TUTORIAL_CONFIG[s.tutorialPhase];
    if(!cfg){ overlay.style.display="none"; return; }
    overlay.style.display="flex";
    const titleEl=document.getElementById("tutorial-title");
    const textEl=document.getElementById("tutorial-text");
    const btnsEl=document.getElementById("tutorial-btns");
    if(titleEl) titleEl.innerHTML=cfg.title;
    if(textEl)  textEl.innerHTML=(s.isGameCleared&&!s.showFormula)?cfg.successMsg:cfg.getMsg(s.tutorialStep);
    if(btnsEl) {
      btnsEl.innerHTML="";
      if(s.isGameCleared&&!s.showFormula) {
        const btn=document.createElement("button");
        btn.className="btn btn-start";
        btn.innerHTML=cfg.nextBtnText;
        btn.onclick=()=>cfg.nextPhase?gameAction('SET_PHASE',cfg.nextPhase):gameAction('SKIP');
        btnsEl.appendChild(btn);
      } else {
        const skip=document.createElement("button");
        skip.className="btn tutorial-btn-skip";
        skip.textContent="スキップ";
        skip.onclick=()=>gameAction('SKIP');
        btnsEl.appendChild(skip);
      }
    }
  }

  function renderCards(s) {
    const gc=document.getElementById("game");
    if(!gc) return;

    /* グリッド列数を最適化して CSS変数で渡す */
    const cols = bestCols(s.cards.length);
    gc.style.setProperty('--cols', cols);

    const existIds=Array.from(gc.children).map(c=>c.id);
    const stateIds=s.cards.map(c=>c.id);
    const needsRebuild = existIds.length!==stateIds.length
      || !stateIds.every(id=>existIds.includes(id));

    if(needsRebuild) {
      gc.innerHTML="";
      s.cards.forEach(c=>{
        const el=document.createElement("div");
        el.className="card"; el.id=c.id;
        el.innerHTML=`<div class="inner"><div class="front"></div><div class="back"></div></div>`;
        el.onclick=()=>dispatch({type:AT.FLIP_CARD,payload:c.id});
        gc.appendChild(el);
      });
    }

    s.cards.forEach(c=>{
      const el=document.getElementById(c.id);
      if(!el) return;
      const inner=el.querySelector(".inner");
      if(inner) {
        el.classList.toggle("highlight-pulse", isHighlight(s,c));
        el.classList.toggle("shake", s.shakeCardId===c.id);
        inner.classList.toggle("flipped", c.isFlipped);
      }
      el.style.visibility=c.isCleared?"hidden":"visible";
    });
  }

  function isHighlight(s, card) {
    if(s.mode!==GameMode.TUTORIAL||card.isCleared) return false;
    const uncleared=s.cards.filter(c=>!c.isCleared);
    if(!uncleared.length) return false;
    if(s.tutorialPhase===TutorialPhase.DEMO)
      return (s.tutorialStep===1&&card.id===uncleared[0]?.id)
          || (s.tutorialStep===2&&card.id===uncleared[1]?.id);
    if(s.tutorialPhase===TutorialPhase.GUIDE) {
      if(s.tutorialStep===1) return true;
      if(s.tutorialStep===2&&s.flipped.first) {
        const fc=s.cards.find(c=>c.id===s.flipped.first);
        return fc&&Math.abs(fc.v+card.v-1)<0.01;
      }
    }
    return false;
  }

  function renderPieces(s) {
    const stage=document.getElementById("stage");
    if(!stage) return;
    const PS=68;
    s.cards.forEach(c=>{
      const pid=`piece-${c.id}`;
      let pEl=document.getElementById(pid);
      if(c.isFlipped&&!c.isCleared) {
        if(!pEl) {
          const cardEl=document.getElementById(c.id);
          if(cardEl) {
            const rect=cardEl.getBoundingClientRect();
            pEl=document.createElement("div");
            pEl.className="piece"; pEl.id=pid;
            pEl.style.left=(rect.left+(rect.width-PS)/2)+"px";
            pEl.style.top=(rect.top+(rect.height-PS)/2)+"px";
            const deg=c.v*360;
            pEl.innerHTML=`<div class="circle" style="background:conic-gradient(${c.color} ${deg}deg,transparent ${deg}deg);transform:rotate(-90deg);"></div><div class="label">${c.l}</div>`;
            stage.appendChild(pEl);
          }
        }
      } else if(pEl) { pEl.remove(); }
    });
  }

  function renderResults(s) {
    const rc=document.getElementById("result");
    if(!rc) return;
    const cleared=s.cards.filter(c=>c.isCleared).length/2;
    if(rc.children.length<cleared&&s.lastMatchedPair&&s.status===GameState.IDLE) {
      const {a,b}=s.lastMatchedPair;
      const item=document.createElement("div");
      item.className="result-item";
      const deg=a.v*360;
      item.innerHTML=`
        <div style="position:relative;width:44px;height:44px;">
          <div class="plate" style="width:60px;height:60px;"></div>
          <div class="circle" style="position:absolute;top:0;left:0;background:conic-gradient(${a.color} ${deg}deg,${b.color} ${deg}deg);"></div>
          <div style="position:absolute;width:12px;height:12px;background:radial-gradient(circle at 35% 35%,#f6c76b,#d4911c);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:1px 2px 3px rgba(0,0,0,0.25);z-index:5;"></div>
        </div>
        <div class="formula">${a.l} + ${b.l} = 1</div>`;
      rc.appendChild(item);
    } else if(cleared===0) { rc.innerHTML=""; }
  }

  function triggerMatchAnim(a, b, onComplete) {
    const gc=document.getElementById("game");
    if(!gc){ onComplete(); return; }
    const gcRect=gc.getBoundingClientRect();
    const tx=gcRect.left+gcRect.width/2;
    const ty=gcRect.top+gcRect.height/2;
    const stage=document.getElementById("stage");
    const plate=document.createElement("div");
    plate.className="plate";
    plate.style.cssText=`width:100px;height:100px;position:absolute;z-index:1;left:${tx}px;top:${ty}px;border-radius:50%;`;
    if(stage) stage.prepend(plate);
    [a,b].forEach(card=>{
      const p=document.getElementById(`piece-${card.id}`);
      if(!p) return;
      p.style.zIndex="2";
      p.style.left=tx+"px"; p.style.top=ty+"px";
      p.style.transform="translate(-50%,-50%)";
    });
    /* 回転して合体 → そのまま少し静止 → 終了 */
    const t1=setTimeout(()=>{
      const p2=document.getElementById(`piece-${b.id}`);
      if(p2){ const circle=p2.querySelector('.circle'); if(circle) circle.style.transform=`rotate(${a.v*360-90}deg)`; }
    },800);
    const t2=setTimeout(()=>{ if(plate.parentNode) plate.remove(); onComplete(); },TIMING.MATCH_ANIM_TOTAL);
    timers.timeouts.push(t1,t2);
  }

  /* ===== アクション ===== */
  function gameAction(action, payload) {
    switch(action) {
      case 'START':      dispatch({type:AT.START_GAME}); break;
      case 'PLAY_AGAIN': dispatch({type:AT.PLAY_AGAIN}); break;
      case 'PRACTICE':   dispatch({type:AT.START_TUTORIAL}); break;
      case 'SET_PHASE':  dispatch({type:AT.SET_TUTORIAL_PHASE,payload}); break;
      case 'SKIP':       dispatch({type:AT.SKIP_TUTORIAL}); break;
      case 'SET_LEVEL':  dispatch({type:AT.SET_LEVEL,payload}); break;
      case 'RESET':      init(); break;
    }
  }

  function init() {
    resetEffectsState();
    dispatch({type:AT.SET_LEVEL, payload:state.level});
    if(!localStorage.getItem('hasPlayedTutorial')) gameAction('PRACTICE');
  }

  /* ウィンドウリサイズ時にグリッド再計算 */
  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const gc=document.getElementById("game");
      if(gc&&state.cards.length) gc.style.setProperty('--cols', bestCols(state.cards.length));
    }, 150);
  });

  init();
</script>
</body>
